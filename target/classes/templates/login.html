<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — ShopSphere Pro</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh;">
    <div class="card-glass" style="max-width: 420px; width: 100%; margin: 2rem;">
        <div style="text-align: center; margin-bottom: 2rem;">
            <div class="brand-icon" style="margin: 0 auto 1rem; width: 44px; height: 44px; font-size: 1.25rem;">⚡</div>
            <h1 style="font-size: 1.5rem; font-weight: 700; color: #fff;">ShopSphere Pro</h1>
            <p style="color: var(--text-secondary); font-size: 0.9rem; margin-top: 0.25rem;">Warehouse Management System</p>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div style="margin-bottom: 1.25rem;">
                <label style="display: block; font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 0.4rem;">Work Email</label>
                <input type="email" id="email" class="form-input" style="width: 100%;" placeholder="admin@shopsphere.com" required>
            </div>
            <div style="margin-bottom: 1.5rem;">
                <label style="display: block; font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 0.4rem;">Password</label>
                <input type="password" id="password" class="form-input" style="width: 100%;" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-primary" style="width: 100%; justify-content: center; padding: 0.75rem;">Authenticate Session</button>
            <div id="loginError" style="display: none; margin-top: 1rem; color: var(--accent-rose); font-size: 0.85rem; text-align: center;"></div>
        </form>

        <div style="margin-top: 2rem; padding-top: 1rem; border-top: 1px solid var(--border-card); font-size: 0.8rem; color: var(--text-muted); line-height: 1.6;">
            <strong>Test Accounts:</strong><br>
            • Admin: <code>admin@shopsphere.com</code> / <code>Admin@123</code><br>
            • Warehouse Manager: <code>manager@shopsphere.com</code> / <code>Manager@123</code><br>
            • Delivery Partner: <code>delivery@shopsphere.com</code> / <code>Delivery@123</code><br>
            • Customer: <code>customer@shopsphere.com</code> / <code>Customer@123</code>
        </div>
    </div>

    <script>
        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errDiv = document.getElementById('loginError');

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                if (res.ok) {
                    const data = await res.json();
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data));
                    window.location.href = '/dashboard';
                } else {
                    errDiv.innerText = 'Authentication failed. Please verify credentials.';
                    errDiv.style.display = 'block';
                }
            } catch (err) {
                errDiv.innerText = 'Server error during authentication.';
                errDiv.style.display = 'block';
            }
        }
    </script>
</body>
</html>
